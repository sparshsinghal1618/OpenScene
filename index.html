<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<title>OpenScene — Professional open-source video editor</title>
<meta name="description" content="OpenScene is a free, open-source, professional non-linear video editor for Windows. Cut, compose, mix, title and export — entirely on your own machine." />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#14161b" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="OpenScene" />
<meta name="application-name" content="OpenScene" />
<!-- No remote content is ever loaded; every asset is local, a blob: or a data: URL. -->
<link rel="stylesheet" href="css/app.css" />
<link rel="stylesheet" href="css/mobile.css" />
</head>
<body>
<div id="app">

  <!-- ============ menu bar ============ -->
  <header id="menubar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="brandBadge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26314a"/><stop offset="1" stop-color="#101420"/></linearGradient>
          <linearGradient id="brandAccent" x1="0.1" y1="0" x2="1" y2="0.6"><stop offset="0" stop-color="#4a9eff"/><stop offset="1" stop-color="#8f7bff"/></linearGradient>
        </defs>
        <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#brandBadge)"/>
        <rect x="103" y="158" width="16" height="196" rx="8" fill="url(#brandAccent)"/>
        <rect x="341" y="158" width="68" height="34" rx="17" fill="#fff" fill-opacity="0.92"/>
        <rect x="341" y="239" width="46" height="34" rx="17" fill="#fff" fill-opacity="0.55"/>
        <rect x="341" y="320" width="58" height="34" rx="17" fill="#fff" fill-opacity="0.32"/>
        <path d="M160 183.96 L160 328.04 L284.97 256 Z" fill="url(#brandAccent)" stroke="url(#brandAccent)" stroke-width="30" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">OpenScene</span>
      <span class="brand-ver" id="brandVer">1.0</span>
    </div>
    <nav class="menus">
      <button class="menu-btn" id="menuFile">File</button>
      <button class="menu-btn" id="menuEdit">Edit</button>
      <button class="menu-btn" id="menuAdd">Add</button>
      <button class="menu-btn" id="menuClip">Clip</button>
      <button class="menu-btn" id="menuTrack">Track</button>
      <button class="menu-btn" id="menuTools">Tools</button>
      <button class="menu-btn" id="menuView">View</button>
      <button class="menu-btn" id="menuHelp">Help</button>
    </nav>
    <div class="doc-title" id="docTitle" title="Current project">Untitled Project</div>
    <div class="toolbar">
      <button class="btn btn-tool" id="tbImport" title="Import media (Ctrl+I)">Import</button>
      <button class="btn btn-tool" id="tbSave" title="Save project (Ctrl+S)">Save</button>
      <button class="btn btn-tool" id="tbExport" title="Export (Ctrl+E)">Export</button>
      <button class="btn btn-icon" id="tbSettings" title="Project settings">Settings</button>

      <span class="toolbar-sep" role="separator"></span>

      <!-- Edit tools. These mirror the timeline's own shortcuts (S, M) and add
           the speed control, so the common edits do not require a right-click. -->
      <div class="toolbar-group">
        <button class="tbtn" id="tbCut" title="Cut at playhead - razor (S)" aria-label="Cut at playhead">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="5.6" cy="15.2" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="14.4" cy="15.2" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7.3 13.4 14.6 3.2M12.7 13.4 5.4 3.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button class="tbtn" id="tbMarker" title="Add marker at playhead (M)" aria-label="Add marker at playhead">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 17V3.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M5.4 4.2h9.4l-2.2 3 2.2 3H5.4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </button>
        <button class="tbtn tbtn-speed" id="tbSpeed" title="Clip speed - retime the selected clip" aria-label="Clip speed">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16.6a6.6 6.6 0 1 1 5.7-3.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M10 10.4l3.6-3.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span class="speed-badge" id="tbSpeedBadge">1x</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ============ left dock: project files / transitions / effects ============ -->
  <div id="main">

    <aside id="dockLeft" class="panel panel-left" aria-label="Library">
      <div class="dock-tabs" id="dockTabs" role="tablist">
        <button class="dock-tab on" id="dockTabFiles" data-dock="binPanel" role="tab">Project Files</button>
        <button class="dock-tab" id="dockTabTransitions" data-dock="transitionsPanel" role="tab">Transitions</button>
        <button class="dock-tab" id="dockTabEffects" data-dock="effectsPanel" role="tab">Effects</button>
      </div>
      <div class="dock-panes">
        <div id="binPanel" class="dock-pane on" role="tabpanel"></div>
        <div id="transitionsPanel" class="dock-pane" role="tabpanel"></div>
        <div id="effectsPanel" class="dock-pane" role="tabpanel"></div>
      </div>
    </aside>
    <div id="splitLeft" class="splitter" title="Drag to resize"></div>

    <section id="center">
      <div id="previewWrap">
        <div id="previewStage">
          <canvas id="preview" width="1280" height="720"></canvas>
          <div id="statsBox" class="stats" style="display:none"></div>
          <div class="preview-badge" id="previewBadge">Preview</div>
        </div>

        <div id="previewControls" class="transport">
          <div class="transport-row">
            <div class="transport-group">
              <button class="tbtn" id="btnStart" title="Go to start (Home)" aria-label="Go to start">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 5v10M16 5l-8 5 8 5z"/></svg>
              </button>
              <button class="tbtn" id="btnPrevEdit" title="Previous edit point (Page Up)" aria-label="Previous edit point">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5v10M15 5l-7 5 7 5zM11 5l-6 5 6 5z" opacity="0.55"/><path d="M15 5l-7 5 7 5z"/></svg>
              </button>
              <button class="tbtn" id="btnStepBack" title="Step back one frame (Left)" aria-label="Step back one frame">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M14 5l-8 5 8 5z"/></svg>
              </button>
              <button class="tbtn tbtn-play" id="btnPlay" title="Play / pause (Space)" aria-label="Play or pause">
                <svg class="ic-play" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4l11 6-11 6z"/></svg>
                <svg class="ic-pause" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 5h3v10H6zM11 5h3v10h-3z"/></svg>
              </button>
              <button class="tbtn" id="btnStepFwd" title="Step forward one frame (Right)" aria-label="Step forward one frame">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l7 5-7 5z"/></svg>
              </button>
              <button class="tbtn" id="btnNextEdit" title="Next edit point (Page Down)" aria-label="Next edit point">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l7 5-7 5z"/><path d="M9 5l6 5-6 5z" opacity="0.55"/><path d="M15 5v10" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
              </button>
              <button class="tbtn" id="btnEnd" title="Go to end (End)" aria-label="Go to end">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M14 5v10M4 5l8 5-8 5z"/></svg>
              </button>
            </div>

            <div class="transport-group timecode-group">
              <input class="tc-input" id="tcInput" value="00:00:00:00" spellcheck="false" title="Timecode (hh:mm:ss:ff) — type a value and press Enter" />
              <span class="tc-sep">/</span>
              <span class="tc-dur" id="tcDur" title="Project duration">00:00:00:00</span>
            </div>

            <div class="transport-group">
              <button class="tbtn" id="btnLoop" title="Toggle loop playback (L)" aria-label="Loop">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8a4 4 0 0 1 4-4h6M16 12a4 4 0 0 1-4 4H6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M13 2l2.5 2L13 6zM7 14l-2.5 2L7 18z"/></svg>
              </button>
              <button class="tbtn" id="btnIn" title="Set in point (I)" aria-label="Set in point">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4h2v12H4zM16 4l-7 6 7 6z"/></svg>
              </button>
              <button class="tbtn" id="btnOut" title="Set out point (O)" aria-label="Set out point">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M14 4h2v12h-2zM4 4l7 6-7 6z"/></svg>
              </button>
              <button class="tbtn" id="btnSnapshot" title="Export the current frame as a PNG (Ctrl+Shift+E)" aria-label="Save frame">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h3l1.4-2h5.2L14 6h3v10H3z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="10.5" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
              </button>
              <button class="tbtn" id="btnFullscreen" title="Fullscreen preview (F11)" aria-label="Fullscreen">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8V4h4M16 8V4h-4M4 12v4h4M16 12v4h-4" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
              </button>
            </div>

            <div class="transport-group audio-group">
              <span class="vol-ico" title="Master volume">Vol</span>
              <input type="range" id="volRange" min="0" max="200" value="100" class="vol-range" />
              <span class="vol-label" id="volLabel">100%</span>
              <div class="meter" title="Output level">
                <div class="meter-bar"><div class="meter-fill" id="meterL"></div></div>
                <div class="meter-bar"><div class="meter-fill" id="meterR"></div></div>
              </div>
            </div>

            <div class="transport-group">
              <select id="prQuality" class="mini-select" title="Preview quality">
                <option value="auto" selected>Auto</option>
                <option value="1">Full</option>
                <option value="0.5">Half</option>
                <option value="0.25">Quarter</option>
              </select>
              <button class="tbtn" id="tbShortcuts" title="Keyboard shortcuts (?)" aria-label="Shortcuts">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 7a2.2 2.2 0 1 1 3 2c-.7.4-1 .8-1 1.6M10 14.5h.01" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="10" cy="10" r="7.4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div id="splitRight" class="splitter" title="Drag to resize"></div>
    <aside id="propsPanel" class="panel panel-right" aria-label="Properties"></aside>
  </div>

  <!-- ============ timeline ============ -->
  <div id="splitTimeline" class="splitter horizontal" title="Drag to resize the timeline"></div>
  <div id="timelinePanel"></div>

  <!-- ============ mobile pane bar (phones and small tablets only) ============ -->
  <nav id="mobileBar" aria-label="Workspace">
    <button class="mbar-btn on" data-pane="preview" aria-label="Preview">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M9 9.4l5 2.6-5 2.6z"/></svg><span>Preview</span>
    </button>
    <button class="mbar-btn" data-pane="library" aria-label="Library">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2 2 0 0 1 5 5.5h3.6l1.9 2.2H19a2 2 0 0 1 2 2v7.3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Library</span>
    </button>
    <button class="mbar-btn" data-pane="props" aria-label="Inspector">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 12h3M13 12h7M4 17h7M17 17h3"/><circle cx="15.5" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="14" cy="17" r="2"/></svg><span>Inspector</span>
    </button>
    <button class="mbar-btn" id="mbarTimeline" aria-label="Maximise the timeline">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="4.5" rx="1.6"/><rect x="3" y="12" width="18" height="4.5" rx="1.6"/></svg><span>Timeline</span>
    </button>
  </nav>

  <!-- ============ status bar ============ -->
  <footer id="statusbar">
    <span class="status-dot"></span>
    <span id="statusMsg" class="status-msg"></span>
    <span class="spacer"></span>
    <span id="statusRight" class="status-right"></span>
  </footer>

</div>

<noscript>
  <div class="boot-error"><b>OpenScene needs JavaScript.</b><p>This editor runs entirely in your browser engine; please enable JavaScript and reload.</p></div>
</noscript>

<!-- ============ engine (classic scripts, ordered) ============ -->
<script src="js/util.js"></script>
<script src="js/timebase.js"></script>
<script src="js/model.js"></script>
<script src="js/commands.js"></script>
<script src="js/effects.js"></script>
<script src="js/transitions.js"></script>
<script src="js/customtrans.js"></script>
<script src="js/titles.js"></script>
<script src="js/renderer.js"></script>
<script src="js/media.js"></script>
<script src="js/player.js"></script>
<script src="js/wav.js"></script>
<script src="js/zip.js"></script>
<script src="js/mp4muxer.js"></script>
<script src="js/export.js"></script>
<script src="js/timeline.js"></script>
<script src="js/library.js"></script>
<script src="js/bin.js"></script>
<script src="js/properties.js"></script>
<script src="js/scopes.js"></script>
<script src="js/mobile.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/shortcuts.js"></script>
<script src="js/osp.js"></script>
<script src="js/persist.js"></script>
<script src="js/workspaces.js"></script>
<script src="js/selftest.js"></script>
<script src="js/app.js"></script>
<script>
/* Installable PWA (desktop browsers). Skipped inside
   the native Windows and mobile shells, which already run from local disk. */
(function () {
  if (window.openscene) return;
  if (!/^https?:$/.test(location.protocol)) return;
  if (!('serviceWorker' in navigator)) return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.warn('service worker unavailable:', e && e.message);
    });
  });
})();
</script>
</body>
</html>
